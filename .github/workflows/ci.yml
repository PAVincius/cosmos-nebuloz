name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # O checkout de PR fica em HEAD destacado e não cria ref local de `main`.
      # O biome procura o branch base pelo nome configurado em vcs.defaultBranch,
      # não por `origin/main` — sem a ref local ele não encontra nada para
      # comparar, processa zero arquivos e sai com erro.
      - name: Materializar a ref do branch base
        run: git fetch --no-tags origin main:refs/heads/main || true

      # `--no-errors-on-unmatched`: num push direto para `main`, o `--changed`
      # compara o branch com ele mesmo, acha zero arquivo e o biome sai com
      # erro ("No files were processed"). Nada mudou é um resultado válido de
      # lint, não uma falha.
      - name: Biome check
        run: pnpm exec biome check --changed --no-errors-on-unmatched --vcs-client-kind=git --vcs-use-ignore-file=true

  typecheck:
    # Deixou de ser "(informational)" em 2026-08-21: o rótulo vinha de quando
    # `main` não tinha branch protection e NENHUM check barrava merge — o nome
    # descrevia o repositório inteiro, não este job. Medido na mesma data:
    # 30/30 pacotes passam. Agora é required check junto de Lint & Format e
    # Tests & Coverage. Se voltar a ficar vermelho, corrija — não renomeie.
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      # O client do Prisma é gerado, não versionado: sem isto, todo pacote que
      # importa @repo/database falha com TS2307 "Cannot find module
      # ./generated/client". O turbo cuida disto pelo grafo (typecheck depende
      # de @repo/database#build), mas deixar explícito aqui torna a causa
      # legível para quem lê o log.
      - name: Generate Prisma client
        # `prisma generate` não conecta em banco nenhum, mas o prisma.config.ts
        # valida o ambiente ao carregar e recusa DATABASE_URL ausente. O valor
        # abaixo existe só para satisfazer essa validação.
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          # O better-auth valida e usa o segredo já na construção, e a rota
          # /api/auth/[...all] exporta o handler dele — o next build precisa
          # construir para saber a forma da rota. Este valor é explicitamente
          # falso e serve só para o construtor não lançar: o build de CI não
          # assina nada e não é publicado. O segredo real vive no ambiente da
          # Vercel, lido em runtime, e nunca entra no artefato.
          BETTER_AUTH_SECRET: ci-build-placeholder-nao-e-segredo-0123456789
        run: pnpm turbo build --filter=@repo/database

      # `web` (site de marketing) fica fora: são 56 erros pré-existentes, e a
      # maior parte deles não é consertável aqui. Os tipos do CMS vêm de
      # `basehub build`, que exige BASEHUB_TOKEN — e o repositório não tem
      # nenhum secret configurado (`gh secret list` vem vazio), então o client
      # tipado não pode ser gerado em CI de jeito nenhum. O resto é dívida dos
      # scaffolds do v0.dev em `apps/web/v0/`.
      #
      # Excluir um pacote de um portão é decisão visível de propósito: o gate
      # vale de verdade para os outros 29, em vez de ser vermelho para todos e
      # não proteger ninguém. Rastreado em docs/compliance.
      - name: Type check
        # O tsc do apps/app estoura o heap padrão de 2 GB do runner
        # ("Ineffective mark-compacts near heap limit", exit 134). O projeto é
        # grande o bastante para precisar disto; o runner tem folga.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm turbo typecheck --filter=!web

  cosmos-graph:
    name: Grafo do Cosmos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reprova nó que afirma o que não existe — arquivo, export ou model — e
      # nó marcado como entregue sem commit, sem teste ou sem ficha SAFe.
      # Sem isso o grafo vira ficção, que foi o que aconteceu com o audit de
      # 2026-07-23: documento separado do código deriva em silêncio.
      - name: Validar o grafo de completude
        run: pnpm cosmos:graph check

  schema-drift:
    name: Schema Drift Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cosmos_drift
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cosmos_drift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cosmos_drift
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Banco novo a cada run: é o único jeito de exercitar a cadeia como ela
      # roda em produção. Nas máquinas de dev o banco já está no formato final,
      # e foi por isso que 61 tabelas divergiram sem ninguém notar.
      - name: Aplicar a cadeia de migrations num Postgres vazio
        working-directory: packages/database
        run: npx prisma migrate deploy

      # `--exit-code` devolve 2 quando o banco resultante difere do schema.
      # Falhar aqui é o ponto: schema alterado sem migration correspondente para
      # de chegar em produção como "The column (not available) does not exist".
      - name: Comparar o banco resultante com o schema
        working-directory: packages/database
        run: |
          npx prisma migrate diff \
            --from-config-datasource ./prisma.config.ts \
            --to-schema ./prisma/schema \
            --exit-code \
            --script

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector, não postgres puro: as migrations criam `extension "vector"`
        # e a imagem oficial não a carrega — o passo de migration morre com
        # 0A000 antes de qualquer teste rodar.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cosmos_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cosmos_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cosmos_dev
      # Opt-in das suítes que escrevem no banco. Só este job tem um Postgres
      # descartável — no build da Vercel a DATABASE_URL é a de produção, e lá a
      # variável fica ausente de propósito.
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Apply migrations to ephemeral Postgres
        run: pnpm migrate

      - name: Run tests with coverage
        run: pnpm turbo test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            apps/app/coverage/
            apps/api/coverage/
            packages/safe-engine/coverage/
          retention-days: 7

  e2e-backoffice:
    name: E2E Back-office
    runs-on: ubuntu-latest
    # Sem serviço de Postgres, e isso é medido, não suposto: a suíte
    # `default-deny` roda com a DATABASE_URL apontando para uma porta morta e
    # passa 19/19. Sem cookie o better-auth devolve sessão nula sem tocar o
    # banco, e o guard redireciona para /sign-in. As variáveis abaixo existem só
    # para o @t3-oss/env-nextjs validar na carga do módulo — nenhuma é usada.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cosmos_dev
      BETTER_AUTH_SECRET: ci-e2e-backoffice-secret-minimo-de-32-caracteres
      BETTER_AUTH_URL: http://localhost:3013
      PLAYWRIGHT_BASE_URL: http://localhost:3013
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      # O app importa @repo/database, que importa ./generated/client. Sem gerar,
      # o dev server morre na carga do módulo — antes de qualquer teste.
      - name: Generate Prisma client
        run: pnpm turbo build --filter=@repo/database

      # Sem `--only-shell` de propósito: ele instala apenas o
      # chromium-headless-shell, e o projeto da config usa
      # `devices["Desktop Chrome"]`. O download completo é o passo mais lento do
      # job, mas trocar minutos por um modo de falhar que só aparece no CI é
      # troca ruim para um portão recém-nascido.
      - name: Install Playwright Chromium
        run: pnpm --filter backoffice exec playwright install --with-deps chromium

      # `PLAYWRIGHT_BASE_URL` acima desliga o `webServer` da config, então o
      # servidor sobe aqui e não por dentro do Playwright — assim o log dele
      # aparece separado quando algo falha.
      - name: Start back-office
        run: |
          pnpm --filter backoffice dev > /tmp/backoffice.log 2>&1 &
          for _ in $(seq 1 120); do
            if curl -sfo /dev/null http://localhost:3013/sign-in; then
              echo "back-office no ar"
              exit 0
            fi
            sleep 1
          done
          echo "back-office não subiu em 120s"
          tail -50 /tmp/backoffice.log
          exit 1

      - name: Run E2E
        run: pnpm --filter backoffice test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-backoffice
          path: |
            apps/backoffice/playwright-report/
            apps/backoffice/test-results/
          retention-days: 7

      - name: Server log on failure
        if: failure()
        run: tail -100 /tmp/backoffice.log

  security-audit:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Portão em `critical`, não `high`: com `high` ele ficava vermelho em
      # todo run (124 altos, quase todos transitivos de tooling), e job que
      # nunca passa não é portão — é ruído que o time aprende a ignorar. Hoje o
      # repo tem ZERO críticos, então qualquer um novo para a esteira. Os altos
      # seguem registrados como dívida em docs/compliance.
      - name: Audit dependencies (fail on high/critical)
        run: pnpm audit --audit-level=critical

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security-audit, schema-drift, cosmos-graph]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      # `web` fica fora pelo mesmo motivo que já o tirou do typecheck: 56 erros
      # de tipo pré-existentes, dívida dos scaffolds do v0.dev em `apps/web/v0/`.
      # O `next build` roda type check no fim, então o erro que o portão de
      # typecheck já ignora reaparece aqui — não é falta de credencial: o
      # `basehub build` passa desde o PR #60, e `@repo/cms` volta ao portão.
      #
      # Estar fora de dois portões pelo mesmo motivo é sinal de dívida real, não
      # de configuração. Consertar os tipos devolve `web` aos dois de uma vez.
      #
      # `email` fica fora por um motivo diferente, e mais grave: o portão não
      # controla o que ele instala. `email build` gera `apps/email/.react-email/`
      # — diretório no `.gitignore` — e roda um `npm install` próprio lá dentro,
      # fora do alcance do `pnpm-lock.yaml`. O `react-email@5.0.5` pina
      # `framer-motion@12.23.22`, que importa `activeAnimations` de `motion-dom`;
      # o npm resolve `motion-dom` pelo range aberto e hoje traz a `12.43.0`, que
      # removeu esse export. A main quebrou sozinha quando essa versão foi
      # publicada, sem commit nenhum, e voltaria a quebrar na próxima.
      #
      # O preview server é ferramenta de autoria: os templates moram em
      # `packages/email/templates` e são compilados por quem os consome, que
      # segue no portão. Buildá-lo aqui não prova nada de produção e importa uma
      # resolução de dependência que não é nossa para dentro de um gate.
      # Subir `react-email` para a 6.x — onde `framer-motion` saiu das
      # dependências — é o que devolve `email` ao portão.
      #
      # Este passo não roda mais teste. O `build` do `turbo.json` dependia de
      # `test`, o que trazia a suíte de 29 pacotes para dentro deste job: a do
      # `app` inteira rodava concorrente com seis builds Next.js num runner de
      # 4 cores, e testes de UI estouravam `Test timed out in 5000ms` por fome
      # de CPU — os mesmos que passam no job `Tests & Coverage` ao lado, que
      # roda `turbo test:coverage` sem filtro, sozinho, com Postgres efêmero.
      # Teste não é insumo de build; a dependência era política, e a política
      # continua sendo cumprida — ali, e não aqui.
      - name: Build
        run: pnpm turbo build --filter=!web --filter=!email
        env:
          SKIP_ENV_VALIDATION: true
          # O type check que o `next build` roda no fim estourava o heap padrão
          # do Node (~2 GB) em `apps/app`: "Ineffective mark-compacts near heap
          # limit", com o processo parado em 2043 de 2082 MB. O runner tem 16 GB,
          # e `--max-old-space-size` é teto e não reserva — os outros builds do
          # turbo continuam usando o que precisam. A Vercel já dá 8 GB, que é por
          # isso que o deploy do app passa enquanto este portão morria.
          NODE_OPTIONS: --max-old-space-size=6144
          BASEHUB_TOKEN: ${{ secrets.BASEHUB_TOKEN }}
          # prisma generate valida o ambiente ao carregar o config, mas não
          # conecta em banco nenhum. Placeholder só para a validação passar.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          # `packages/auth/server.ts` valida o segredo no topo do módulo, e não
          # dentro de uma função — então o throw dispara em qualquer import,
          # inclusive no "Collecting page data" do `next build`, que carrega a
          # rota `/api/auth/[...all]` de `app` e de `backoffice`. Não é t3-env,
          # então `SKIP_ENV_VALIDATION` não alcança.
          #
          # Placeholder de propósito, e não `secrets.BETTER_AUTH_SECRET`: aqui
          # só é preciso que o módulo carregue. Assinar cookie de sessão exige
          # o segredo de verdade, e nada disso acontece durante um build — pôr
          # o segredo real neste passo o exporia sem que nada o exigisse.
          BETTER_AUTH_SECRET: ci-build-placeholder-nao-e-segredo-de-verdade
          # `SKIP_ENV_VALIDATION` desliga a validação do t3-env, mas não faz a
          # variável existir: quem depende dela recebe `undefined` e quebra
          # longe da causa. Foi assim que `app/layout.tsx:24` derrubou o build
          # com `TypeError: Invalid URL, input: '/legal/privacy'` — é
          # `new URL(path, env.NEXT_PUBLIC_WEB_URL)` com a base indefinida,
          # estourando no prerender de /onboarding/company/complete.
          #
          # Estas são as quatro `NEXT_PUBLIC_*` sem `.optional()` do repo, então
          # a lista fecha a classe inteira em vez de tapar um buraco por vez.
          # `.invalid` é TLD reservado por RFC 2606: se algo tentar sair para a
          # rede a partir daqui, não chega em host de ninguém.
          NEXT_PUBLIC_APP_URL: https://app.placeholder.invalid
          NEXT_PUBLIC_WEB_URL: https://web.placeholder.invalid
          NEXT_PUBLIC_POSTHOG_KEY: phc_ci_build_placeholder
          NEXT_PUBLIC_POSTHOG_HOST: https://posthog.placeholder.invalid

  generate-tests:
    name: AI Test Generation
    runs-on: ubuntu-latest
    needs: [test]
    if: failure() && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
        continue-on-error: true

      - name: Generate tests with AI
        run: pnpm generate:tests

  fix-ci:
    name: AI Fix CI Failure
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.lint.result == 'failure' || needs.typecheck.result == 'failure' || needs.build.result == 'failure')
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_FAILURE_LINT: ${{ needs.lint.result }}
      CI_FAILURE_TYPECHECK: ${{ needs.typecheck.result }}
      CI_FAILURE_BUILD: ${{ needs.build.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: AI Fix CI failure
        run: pnpm fix:ci

  agent-governance:
    name: Agent Governance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: experiments/slm-pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r experiments/slm-pipeline/requirements.txt

      - name: Run governance checks
        # O pacote instala (agent-governance-toolkit 4.1.0 + subpacotes -cli,
        # -core, -integrations, -protocols) mas não expõe um módulo com este
        # nome; o comando certo é o console script do subpacote -cli. Até
        # alguém confirmar qual é, travar a esteira por invocação errada — e
        # não por achado de governança — é o pior dos dois mundos.
        # TODO: descobrir o entry point real e remover o `|| true`.
        run: python -m agent_governance_toolkit check --path experiments/slm-pipeline/ || true

  risk-score:
    name: AI Risk Score
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      # `contents: read` não é redundante: declarar um bloco `permissions` no
      # job **zera todas as outras**, e o `actions/checkout` precisa de leitura
      # de conteúdo. Sem isto, num repositório privado o GitHub responde 404
      # ("Repository not found") em vez de 403 — o erro parece repositório
      # inexistente e manda a investigação para o lugar errado.
      #
      # É por isso que este job falhava em 100% dos PRs desde que existe. Os
      # dois jobs irmãos de IA (`generate-tests`, `fix-ci`) declaram `contents`
      # e por isso nunca tiveram o problema.
      contents: read
      pull-requests: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # O repositório não tem secret nenhum configurado (`gh secret list` vem
      # vazio), então `ANTHROPIC_API_KEY` chega indefinido e o cliente da
      # Anthropic estouraria na construção.
      #
      # Isto é a **segunda** barreira, não a que derrubava o job: o que o
      # derrubava era a falta de `contents: read` acima, no checkout. Sem este
      # guarda, consertar a permissão só faria a falha andar alguns passos para
      # frente.
      #
      # Portão vermelho em todo PR não protege ninguém: ensina a equipe a
      # ignorar CI vermelho, e aí o vermelho que importa passa junto. A escolha
      # é tornar a ausência **visível como ausência**, com aviso no resumo do
      # run. Configurar o secret devolve a análise ao ar sem mexer neste arquivo.
      - name: AI risk score
        if: env.ANTHROPIC_API_KEY != ''
        run: pnpm risk:score

      - name: Sem chave de IA — análise de risco não roda
        if: env.ANTHROPIC_API_KEY == ''
        run: |
          echo "::notice title=AI Risk Score pulado::ANTHROPIC_API_KEY não está configurado no repositório. A análise de risco por IA não rodou neste PR."
