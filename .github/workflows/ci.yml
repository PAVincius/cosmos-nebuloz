name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # O checkout de PR fica em HEAD destacado e não cria ref local de `main`.
      # O biome procura o branch base pelo nome configurado em vcs.defaultBranch,
      # não por `origin/main` — sem a ref local ele não encontra nada para
      # comparar, processa zero arquivos e sai com erro.
      - name: Materializar a ref do branch base
        run: git fetch --no-tags origin main:refs/heads/main || true

      - name: Biome check
        run: pnpm exec biome check --changed --vcs-client-kind=git --vcs-use-ignore-file=true

  typecheck:
    name: Type Check (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Type check
        run: pnpm turbo typecheck

  cosmos-graph:
    name: Grafo do Cosmos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reprova nó que afirma o que não existe — arquivo, export ou model — e
      # nó marcado como entregue sem commit, sem teste ou sem ficha SAFe.
      # Sem isso o grafo vira ficção, que foi o que aconteceu com o audit de
      # 2026-07-23: documento separado do código deriva em silêncio.
      - name: Validar o grafo de completude
        run: pnpm cosmos:graph check

  schema-drift:
    name: Schema Drift Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cosmos_drift
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cosmos_drift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cosmos_drift
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Banco novo a cada run: é o único jeito de exercitar a cadeia como ela
      # roda em produção. Nas máquinas de dev o banco já está no formato final,
      # e foi por isso que 61 tabelas divergiram sem ninguém notar.
      - name: Aplicar a cadeia de migrations num Postgres vazio
        working-directory: packages/database
        run: npx prisma migrate deploy

      # `--exit-code` devolve 2 quando o banco resultante difere do schema.
      # Falhar aqui é o ponto: schema alterado sem migration correspondente para
      # de chegar em produção como "The column (not available) does not exist".
      - name: Comparar o banco resultante com o schema
        working-directory: packages/database
        run: |
          npx prisma migrate diff \
            --from-config-datasource ./prisma.config.ts \
            --to-schema ./prisma/schema \
            --exit-code \
            --script

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector, não postgres puro: as migrations criam `extension "vector"`
        # e a imagem oficial não a carrega — o passo de migration morre com
        # 0A000 antes de qualquer teste rodar.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cosmos_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cosmos_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cosmos_dev
      # Opt-in das suítes que escrevem no banco. Só este job tem um Postgres
      # descartável — no build da Vercel a DATABASE_URL é a de produção, e lá a
      # variável fica ausente de propósito.
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Apply migrations to ephemeral Postgres
        run: pnpm migrate

      - name: Run tests with coverage
        run: pnpm turbo test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            apps/app/coverage/
            apps/api/coverage/
            packages/safe-engine/coverage/
          retention-days: 7

  security-audit:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (fail on high/critical)
        run: pnpm audit --audit-level=high

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security-audit, schema-drift, cosmos-graph]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Build
        run: pnpm turbo build
        env:
          SKIP_ENV_VALIDATION: true

  generate-tests:
    name: AI Test Generation
    runs-on: ubuntu-latest
    needs: [test]
    if: failure() && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
        continue-on-error: true

      - name: Generate tests with AI
        run: pnpm generate:tests

  fix-ci:
    name: AI Fix CI Failure
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.lint.result == 'failure' || needs.typecheck.result == 'failure' || needs.build.result == 'failure')
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_FAILURE_LINT: ${{ needs.lint.result }}
      CI_FAILURE_TYPECHECK: ${{ needs.typecheck.result }}
      CI_FAILURE_BUILD: ${{ needs.build.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: AI Fix CI failure
        run: pnpm fix:ci

  agent-governance:
    name: Agent Governance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: experiments/slm-pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r experiments/slm-pipeline/requirements.txt

      - name: Run governance checks
        run: python -m agent_governance_toolkit check --path experiments/slm-pipeline/

  risk-score:
    name: AI Risk Score
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: AI risk score
        run: pnpm risk:score
