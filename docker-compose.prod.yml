version: "3.9"
# Cosmos Enterprise — Production Compose
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Required .env vars (copy from apps/app/.env.example and fill):
#   DATABASE_URL, BETTER_AUTH_SECRET, LIVEBLOCKS_SECRET,
#   INNGEST_EVENT_KEY, INNGEST_SIGNING_KEY, CRON_SECRET

services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cosmos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cosmos_prod_password}
      POSTGRES_DB: cosmos
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmos -d cosmos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ─── PgBouncer (connection pooler) ─────────────────────────────────────────
  pgbouncer:
    image: bitnami/pgbouncer:1
    restart: unless-stopped
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: cosmos
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-cosmos_prod_password}
      POSTGRESQL_DATABASE: cosmos
      PGBOUNCER_PORT: 5432
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 1000
      PGBOUNCER_DEFAULT_POOL_SIZE: 25
      PGBOUNCER_MIN_POOL_SIZE: 5
      PGBOUNCER_RESERVE_POOL_SIZE: 10
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # ─── Redis (rate limiting + idempotency + sessions) ────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_prod_password} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_prod_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal

  # ─── App ──────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
      args:
        SKIP_ENV_VALIDATION: "true"
    image: cosmos-app:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - apps/app/.env.local
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cosmos:${POSTGRES_PASSWORD:-cosmos_prod_password}@pgbouncer:5432/cosmos?pgbouncer=true&connection_limit=1
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_prod_password}@redis:6379
      PORT: 3000
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - internal
      - public
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── Nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      app:
        condition: service_healthy
    networks:
      - public
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  nginx_cache:

networks:
  internal:
    driver: bridge
    internal: true
  public:
    driver: bridge
