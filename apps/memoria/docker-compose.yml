# Memória de longo prazo dos agentes da Nebuloz — roda na máquina, não é produção.
#
# O Postgres é o sistema de registro. Qdrant, Neo4j e MinIO são projeções que o
# serviço refaz a partir dele (registro de decisões, D-12 e D-16). Os agentes
# falam com ele por MCP em http://127.0.0.1:8003/mcp.
#
#   pnpm memoria:up        # gera .env, sobe, cria as chaves e importa
#
# Por padrão sobe só o Postgres e o serviço (~250 MB): a busca vetorial e por texto
# roda no próprio Postgres (D-16: Postgres até medir o limite). As projeções são
# perfis, ligados no .env com COMPOSE_PROFILES:
#   vetor   → Qdrant (candidatos da busca vetorial vêm dele)
#   grafo   → Neo4j (ferramenta `relacionadas`)
#   arquivo → MinIO (um JSON por versão, a camada fria)
# Ex.: COMPOSE_PROFILES=vetor,grafo,arquivo liga tudo (~1,2 GB parado). Depois de ligar
# uma projeção com memória já gravada: POST /api/v1/maintenance/rebuild.
#
# Portas só em 127.0.0.1: nada aqui fica exposto na rede.

name: nebuloz-memoria

x-padrao: &padrao
  restart: unless-stopped

services:
  postgres:
    <<: *padrao
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: stec_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}  # ggignore: interpolação do .env, sem valor literal
      POSTGRES_DB: memoria
    ports: ["127.0.0.1:5433:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stec_admin -d memoria"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    <<: *padrao
    image: qdrant/qdrant:v1.19.1
    profiles: [vetor]
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  neo4j:
    <<: *padrao
    image: neo4j:5.26-community
    profiles: [grafo]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?defina NEO4J_PASSWORD no .env}  # ggignore: interpolação do .env, sem valor literal
      # Grafo pequeno (entidades e relações da memória): 512 MB de heap sobram.
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    <<: *padrao
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z}
    command: ["server", "/data", "--console-address", ":9001"]
    profiles: [arquivo]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}  # ggignore: interpolação do .env, sem valor literal
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes: [minio_data:/data]

  # Opcional: embeddings semânticos locais. Sem ele, o serviço usa o embedder
  # "hash" (local, determinístico, sem semântica).
  #   docker compose --profile ollama up -d
  #   docker compose exec ollama ollama pull nomic-embed-text
  #   STEC_EMBEDDING_PROVIDER=ollama no .env, e POST /api/v1/maintenance/reindex
  ollama:
    <<: *padrao
    image: ollama/ollama:0.5.7
    profiles: [ollama]
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama_data:/root/.ollama]

  memoria:
    <<: *padrao
    build: ./servico
    image: nebuloz/memoria:local
    depends_on:
      postgres: {condition: service_healthy}
      # Projeções opcionais: só esperam quando o perfil está ligado.
      neo4j: {condition: service_healthy, required: false}
      qdrant: {condition: service_started, required: false}
      minio: {condition: service_started, required: false}
    environment:
      STEC_ADMIN_DATABASE_URL: postgresql://stec_admin:${POSTGRES_PASSWORD}@postgres:5432/memoria  # ggignore: interpolação do .env, sem valor literal
      STEC_DATABASE_URL: postgresql://stec_app:${STEC_APP_DB_PASSWORD:?defina STEC_APP_DB_PASSWORD no .env}@postgres:5432/memoria  # ggignore: interpolação do .env, sem valor literal
      STEC_APP_DB_PASSWORD: ${STEC_APP_DB_PASSWORD}  # ggignore: interpolação do .env, sem valor literal
      STEC_EMBEDDING_PROVIDER: ${STEC_EMBEDDING_PROVIDER:-hash}
      STEC_OLLAMA_URL: http://ollama:11434
      # Liga cada projeção cujo perfil está ativo (vetor, grafo, arquivo).
      STEC_PROJECOES: ${COMPOSE_PROFILES:-}
      STEC_NEO4J_PASSWORD: ${NEO4J_PASSWORD}  # ggignore: interpolação do .env, sem valor literal
      STEC_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      STEC_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}  # ggignore: interpolação do .env, sem valor literal
    # Fontes que o importador lê (lições do Maestri, ADRs, registro de decisões). Só leitura.
    volumes:
      - ../../.maestri/memoria:/fontes/.maestri/memoria:ro
      - ../../docs/adr:/fontes/docs/adr:ro
      - ../../docs/produto:/fontes/docs/produto:ro
    ports: ["127.0.0.1:${MEMORIA_PORTA:-8003}:8000"]

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  minio_data:
  ollama_data:
