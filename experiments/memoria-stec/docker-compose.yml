# Laboratório de memória de longo prazo (STEC) — não é produção.
#
# O Postgres é o sistema de registro. Qdrant, Neo4j e MinIO são projeções que o
# Memory Control Plane refaz a partir dele (registro de decisões, D-12 e D-16).
#
#   cp .env.example .env   # e troque todas as senhas
#   docker compose up -d --build
#   docker compose exec memory-control-plane python -m app.cli criar-tenant nebuloz "Nebuloz"
#   docker compose exec memory-control-plane python -m app.cli criar-chave nebuloz agente-teste escrita
#
# Portas só em 127.0.0.1: nada aqui fica exposto na rede.

name: memoria-stec

x-padrao: &padrao
  restart: unless-stopped

services:
  postgres:
    <<: *padrao
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: stec_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}  # ggignore: interpolação do .env, sem valor literal
      POSTGRES_DB: memoria
    ports: ["127.0.0.1:5433:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stec_admin -d memoria"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    <<: *padrao
    image: qdrant/qdrant:v1.19.1
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  neo4j:
    <<: *padrao
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?defina NEO4J_PASSWORD no .env}  # ggignore: interpolação do .env, sem valor literal
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    <<: *padrao
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}  # ggignore: interpolação do .env, sem valor literal
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes: [minio_data:/data]

  # Opcional: embeddings semânticos locais. Sem ele, o serviço usa o embedder
  # "hash" (local, determinístico, sem semântica).
  #   docker compose --profile ollama up -d
  #   docker compose exec ollama ollama pull nomic-embed-text
  #   STEC_EMBEDDING_PROVIDER=ollama no .env, e POST /api/v1/maintenance/reindex
  ollama:
    <<: *padrao
    image: ollama/ollama:0.5.7
    profiles: [ollama]
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama_data:/root/.ollama]

  memory-control-plane:
    <<: *padrao
    build: ./memory-control-plane
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      qdrant: {condition: service_started}
      minio: {condition: service_started}
    environment:
      STEC_ADMIN_DATABASE_URL: postgresql://stec_admin:${POSTGRES_PASSWORD}@postgres:5432/memoria  # ggignore: interpolação do .env, sem valor literal
      STEC_DATABASE_URL: postgresql://stec_app:${STEC_APP_DB_PASSWORD:?defina STEC_APP_DB_PASSWORD no .env}@postgres:5432/memoria  # ggignore: interpolação do .env, sem valor literal
      STEC_APP_DB_PASSWORD: ${STEC_APP_DB_PASSWORD}  # ggignore: interpolação do .env, sem valor literal
      STEC_EMBEDDING_PROVIDER: ${STEC_EMBEDDING_PROVIDER:-hash}
      STEC_OLLAMA_URL: http://ollama:11434
      STEC_QDRANT_URL: http://qdrant:6333
      STEC_NEO4J_URL: bolt://neo4j:7687
      STEC_NEO4J_PASSWORD: ${NEO4J_PASSWORD}  # ggignore: interpolação do .env, sem valor literal
      STEC_MINIO_ENDPOINT: minio:9000
      STEC_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      STEC_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}  # ggignore: interpolação do .env, sem valor literal
    ports: ["127.0.0.1:8003:8000"]

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  minio_data:
  ollama_data:
